---
# Read-only check that the test VMs are reachable and ready for Ansible.
# Installs and changes nothing.
- name: Check test VMs
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Private IP is configured
      ansible.builtin.assert:
        that: private_ip in ansible_facts.all_ipv4_addresses
        fail_msg: "{{ private_ip }} not found in {{ ansible_facts.all_ipv4_addresses }}"
        quiet: true

    - name: Other VMs are reachable over the private network
      ansible.builtin.command: "ping -c 2 -W 2 {{ hostvars[item].private_ip }}"
      loop: "{{ groups['all'] | difference([inventory_hostname]) }}"
      changed_when: false

    - name: Check data volume
      ansible.builtin.stat:
        path: "{{ data_volume }}"
        follow: true
      register: data_vol
      when: data_volume is defined

    - name: Data volume is attached
      ansible.builtin.assert:
        that: data_vol.stat.exists
        fail_msg: "{{ data_volume }} not present"
        quiet: true
      when: data_volume is defined

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} ({{ image }})"
          - "Python: {{ ansible_facts.python_version }} ({{ ansible_facts.python.executable }})"
          - "{{ ansible_facts.processor_vcpus }} vCPU, {{ ansible_facts.memtotal_mb }} MB RAM"
          - "{{ ansible_host }} / {{ private_ip }} / {{ fqdn }}"
          - "Data volume: {{ data_volume | default('none') }}"
