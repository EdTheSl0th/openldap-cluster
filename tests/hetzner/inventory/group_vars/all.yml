---
# Hetzner test environment (hosts.yml next to this file is generated by
# terraform/inventory.tf). Domain and RBAC test data: tests/e2e/vars/directory.yml.

# Master seed for all derived secrets; generated once, kept out of git.
ldap_secret_seed: >-
  {{ lookup('ansible.builtin.password', inventory_dir ~ '/.secrets/ldap_secret_seed',
            length=64, chars=['ascii_letters', 'digits']) }}
ldap_pki_dir: "{{ inventory_dir }}/.ldap-pki"

# --- Adapter: Terraform inventory -> generic collection variables ---------------
# On other platforms (Proxmox, VMware, ...) these are simply set per host or
# left to their fact-based defaults.
ldap_node_address: "{{ private_ip }}"
ldap_node_fqdn: "{{ fqdn }}"
ldap_client_fqdn: "{{ fqdn }}"
ldap_allowed_networks: ["{{ private_subnet }}"]
