---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN; no job needs to write.
permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tools and dependencies
        run: |
          pip install ansible-core ansible-lint
          ansible-galaxy collection install community.general community.crypto ansible.posix

      - name: Make this collection importable by the test playbooks
        run: make -C tests collection

      - name: Lint
        run: ANSIBLE_COLLECTIONS_PATH="$PWD/tests/.collections:$HOME/.ansible/collections" ansible-lint

  ansible-test:
    name: ${{ matrix.type }} (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: [stable-2.19, stable-2.20, stable-2.21]
        type: [sanity, units]
    steps:
      - uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3  # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: ${{ matrix.type }}
          # No Codecov: avoids uploading data to a third party and the nested
          # actions codecov/codecov-action and irongut/CodeCoverageSummary.
          coverage: never

  molecule:
    name: molecule (debian-${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ["12", "13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ansible-core molecule "molecule-plugins[docker]" cryptography

      - name: Make this collection importable by the tests
        run: make -C tests collection

      # Two providers + one client as systemd containers: converge,
      # idempotence and the end-to-end tests in tests/e2e (incl. VRRP failover).
      - name: Molecule
        run: molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  build:
    name: Build collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install ansible-core
          ansible-galaxy collection build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: collection
          path: "*.tar.gz"
