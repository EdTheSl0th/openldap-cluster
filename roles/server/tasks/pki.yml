---
# Internal CA on the controller. The CA key never leaves the controller, the
# node keys never leave the nodes; only CSRs and certificates travel.
- name: Internal CA on the controller
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  block:
    - name: CA directory
      ansible.builtin.file:
        path: "{{ ldap_pki_dir }}"
        state: directory
        mode: "0700"

    - name: CA key
      community.crypto.openssl_privatekey:
        path: "{{ ldap_pki_dir }}/ca.key"
        type: ECC
        curve: secp384r1
        mode: "0600"

    - name: CA CSR
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ ldap_pki_dir }}/ca.key"
        common_name: "{{ ldap_pki_ca_name }}"
        use_common_name_for_san: false
        basic_constraints: ["CA:TRUE", "pathlen:0"]
        basic_constraints_critical: true
        key_usage: [keyCertSign, cRLSign]
        key_usage_critical: true
      register: _ldap_ca_csr
      changed_when: false

    - name: CA certificate
      community.crypto.x509_certificate:
        path: "{{ ldap_pki_dir }}/ca.crt"
        csr_content: "{{ _ldap_ca_csr.csr }}"
        privatekey_path: "{{ ldap_pki_dir }}/ca.key"
        provider: selfsigned
        selfsigned_not_after: "+3650d"
        mode: "0644"

- name: CA certificate on the node
  ansible.builtin.copy:
    src: "{{ ldap_pki_dir }}/ca.crt"
    dest: "{{ ldap_tls_dir }}/ca.crt"
    mode: "0644"
  notify: Restart slapd

- name: Server key (ECDSA P-256)
  community.crypto.openssl_privatekey:
    path: "{{ ldap_tls_dir }}/server.key"
    type: ECC
    curve: secp256r1
    owner: root
    group: openldap
    mode: "0640"
  notify: Restart slapd

- name: Server CSR
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ ldap_tls_dir }}/server.key"
    common_name: "{{ ldap_node_fqdn }}"
    subject_alt_name: "{{ _sans | unique }}"
    extended_key_usage: [serverAuth, clientAuth]
    key_usage: [digitalSignature]
    key_usage_critical: true
  vars:
    _sans: >-
      {{ ['DNS:' ~ ldap_node_fqdn, 'DNS:' ~ inventory_hostname,
          'IP:' ~ ldap_node_address]
         + (['IP:' ~ ldap_vip] if ldap_vip | length > 0 else [])
         + ldap_tls_extra_sans }}
  register: _ldap_csr
  changed_when: false

- name: Read existing server certificate
  ansible.builtin.slurp:
    src: "{{ ldap_tls_dir }}/server.crt"
  register: _ldap_cert_current
  failed_when: false

- name: Sign server certificate with the internal CA
  community.crypto.x509_certificate_pipe:
    content: "{{ (_ldap_cert_current.content | b64decode) if _ldap_cert_current.content is defined else omit }}"
    csr_content: "{{ _ldap_csr.csr }}"
    provider: ownca
    ownca_path: "{{ ldap_pki_dir }}/ca.crt"
    ownca_privatekey_path: "{{ ldap_pki_dir }}/ca.key"
    ownca_not_after: "+{{ ldap_tls_cert_days }}d"
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: _ldap_cert

- name: Install server certificate
  ansible.builtin.copy:
    content: "{{ _ldap_cert.certificate }}"
    dest: "{{ ldap_tls_dir }}/server.crt"
    mode: "0644"
  notify: Restart slapd
