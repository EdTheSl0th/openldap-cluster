---
- name: Include directory for nftables
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Main nftables configuration
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    mode: "0755"
    # No "flush ruleset": rules of other software (Docker, fail2ban, ...)
    # stay untouched; every file in nftables.d replaces only its own table.
    content: |
      #!/usr/sbin/nft -f
      # Managed by Ansible (openldap.cluster)
      include "/etc/nftables.d/*.nft"
  notify: Reload nftables

- name: LDAP host firewall
  ansible.builtin.template:
    src: ldap.nft.j2
    dest: /etc/nftables.d/50-ldap.nft
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: started
    enabled: true
