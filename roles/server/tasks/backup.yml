---
- name: Backup script
  ansible.builtin.template:
    src: slapd-backup.sh.j2
    dest: /usr/local/sbin/slapd-backup
    mode: "0750"

- name: Backup units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: slapd-backup.service
      content: |
        [Unit]
        Description=Dump OpenLDAP configuration and data (slapcat)
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/slapd-backup
        Nice=10
    - name: slapd-backup.timer
      content: |
        [Unit]
        Description=Daily OpenLDAP backup
        [Timer]
        OnCalendar=daily
        RandomizedDelaySec=1h
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: _ldap_backup_units

- name: Enable backup timer
  ansible.builtin.systemd_service:
    name: slapd-backup.timer
    state: started
    enabled: true
    daemon_reload: "{{ _ldap_backup_units is changed }}"
