---
# Order is part of the DN ({0}syncprov, ...): only ever append.
_ldap_overlays:
  - name: syncprov
    class: olcSyncProvConfig
    attrs:
      olcSpCheckpoint: 100 10
      olcSpSessionLog: "1000"
  - name: ppolicy
    class: olcPPolicyConfig
    attrs:
      olcPPolicyDefault: "cn=default,{{ ldap_dn_policies }}"
      olcPPolicyHashCleartext: "TRUE"
      olcPPolicyUseLockout: "FALSE"
  - name: dynlist
    class: olcDynListConfig
    ordered: true
    attrs:
      olcDynListAttrSet: ["groupOfURLs memberURL member+memberOf@groupOfNames"]
  - name: unique
    class: olcUniqueConfig
    attrs:
      olcUniqueURI: "ldap:///{{ ldap_dn_people }}?uid,uidNumber?sub"

_ldap_peers: "{{ groups[ldap_servers_group] | sort | reject('eq', inventory_hostname) | list }}"
# Peer addresses without the peers' facts (single-node deployments):
# inventory ldap_node_address, else ansible_host.
_ldap_peer_addr: >-
  {%- set out = {} -%}
  {%- for p in _ldap_peers -%}
  {%- set _ = out.update({p: hostvars[p].ldap_node_address | default(hostvars[p].ansible_host)}) -%}
  {%- endfor -%}
  {{ out }}
_ldap_replicator_pw: "{{ ldap_secret_seed | openldap.cluster.derive_password('replicator') }}"

# No wildcard listeners: node address, shared IP and the local socket only.
_ldap_listeners: >-
  {{ (['ldapi:///'] + ([ldap_node_address] + ([ldap_vip] if ldap_vip | length > 0 else []))
      | map('regex_replace', '^(.*)$', 'ldap://\1/ ldaps://\1/') | list) | join(' ') }}
# Debian 12 links slapd against GnuTLS, Debian 13 against OpenSSL.
_ldap_gnutls: "{{ 'libgnutls' in _ldap_ldd.stdout }}"
