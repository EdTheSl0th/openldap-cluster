---
# Order matters: handlers run in this order.
- name: Create runtime directory
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/slapd.conf
  changed_when: true

- name: Restart slapd
  ansible.builtin.systemd_service:
    name: slapd
    state: restarted
    daemon_reload: true

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
